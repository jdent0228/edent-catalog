<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이덴트 상품 카탈로그</title>
<style>
  :root{
    --bg:#ffffff;--panel:#f7f8fa;--line:#eaecef;--line-strong:#d9dde2;
    --text:#191f28;--muted:#8b95a1;--muted-2:#6b7684;--hover:#f4f6f8;
    --blue:#3182f6;--blue-soft:#e8f1ff;--red:#f04452;--pink:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
    color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px 80px;}

  /* 좌측 사이드바 레이아웃 */
  .layout{display:flex;gap:22px;align-items:flex-start;margin-top:16px;}
  .left{flex:0 0 208px;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .logo-box{display:flex;gap:10px;align-items:flex-start;padding:6px 2px 0;}
  .logo-mark{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;}
  .logo-text{font-size:15px;font-weight:800;letter-spacing:-0.3px;line-height:1.25;padding-top:1px;}
  .logo-text .meta{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.5;}
  .logo-text .meta b{color:var(--muted-2);font-weight:600;}
  .warn{color:var(--red);font-size:12px;display:none;padding:0 2px;}
  .side{position:sticky;top:12px;max-height:calc(100vh - 28px);overflow-y:auto;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;}
  .side-title{font-size:13px;font-weight:800;margin-bottom:8px;letter-spacing:-0.2px;}
  .side-toggle{display:none;}
  .main{flex:1;min-width:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* 검색/정렬/즐겨찾기/뷰 스티키 바 */
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 0 10px;
    border-bottom:1px solid var(--line);}
  .search{display:flex;gap:8px;align-items:center;}
  .search input{flex:1;min-width:0;height:44px;border:1px solid var(--line-strong);border-radius:12px;
    padding:0 14px;font-size:15px;outline:none;background:var(--panel);}
  .search input:focus{border-color:var(--blue);background:#fff;}
  .search select{height:44px;border:1px solid var(--line-strong);border-radius:12px;padding:0 10px;
    font-size:13px;background:var(--panel);color:var(--muted-2);outline:none;cursor:pointer;}
  .favbtn{height:44px;border:1px solid var(--line-strong);border-radius:12px;padding:0 13px;
    background:var(--panel);color:var(--muted-2);font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .favbtn svg{width:16px;height:16px;}
  .favbtn.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  .viewtoggle{flex:0 0 auto;display:flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;}
  .viewtoggle button{width:42px;height:44px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:none;cursor:pointer;color:var(--muted);}
  .viewtoggle button+button{border-left:1px solid var(--line-strong);}
  .viewtoggle button.on{background:var(--blue);color:#fff;}
  .viewtoggle svg{width:18px;height:18px;}

  /* 카테고리 칩 (사이드바 세로 배열, 선택 = 차분한 강조) */
  .cats{display:flex;flex-direction:column;gap:3px;padding:10px 0 2px;}
  .chip{display:flex;align-items:center;gap:7px;font-size:12.5px;
    color:#b4bcc6;border:1px solid transparent;border-radius:8px;padding:6px 9px;cursor:pointer;
    user-select:none;background:none;transition:.12s;word-break:keep-all;}
  .chip::before{content:'';flex:0 0 auto;width:6px;height:6px;border-radius:50%;
    background:var(--line-strong);transition:.12s;}
  .chip i{color:#c8ced6;font-style:normal;font-size:10.5px;flex:0 0 auto;margin-left:auto;}
  .chip:hover{background:#fff;}
  .chip.on{background:#fff;border-color:var(--line);color:var(--text);}
  .chip.on::before{background:var(--blue);}
  .chip.on i{color:var(--muted);}
  .cat-tools{display:flex;gap:6px;align-items:center;}
  .cat-tools button{font-size:11.5px;color:var(--muted-2);background:var(--bg);border:1px solid var(--line-strong);
    border-radius:6px;padding:4px 9px;cursor:pointer;}
  .cat-tools button:hover{background:var(--hover);color:var(--text);}

  /* 모바일: 사이드바 → 접이식 (기본 접힘) */
  @media (max-width:860px){
    .layout{flex-direction:column;gap:10px;margin-top:10px;}
    .left{flex:none;width:100%;gap:10px;}
    .side{position:static;width:100%;max-height:none;padding:0;overflow:visible;}
    .side-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
      background:none;border:none;cursor:pointer;padding:11px 14px;font-size:13px;font-weight:700;
      color:var(--text);}
    .side-toggle b{color:var(--blue);font-weight:700;margin-left:4px;}
    .side-toggle i{font-style:normal;color:var(--muted);transition:transform .15s;}
    .side.open .side-toggle i{transform:rotate(180deg);}
    .side-body{display:none;padding:0 14px 14px;}
    .side.open .side-body{display:block;}
    .side-title{display:none;}
  }

  .count{padding:14px 2px 10px;font-size:12.5px;color:var(--muted);}
  .count b{color:var(--text);font-weight:700;}

  /* 표 영역 (좁은 화면은 가로 스크롤) */
  .table-zone{overflow-x:auto;}

  /* 목록형 헤더 행 */
  .lhead{display:flex;align-items:center;gap:0;min-width:920px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;
    font-size:12px;font-weight:700;color:var(--muted-2);padding:8px 0;margin-bottom:8px;}
  .lhead>div{text-align:center;}
  .lhead .sortable{cursor:pointer;user-select:none;border-radius:6px;}
  .lhead .sortable:hover{background:#eef1f4;color:var(--text);}
  .lhead .sortable i{font-style:normal;font-size:9px;color:var(--line-strong);margin-left:3px;}
  .lhead .sortable.on{color:var(--blue);}
  .lhead .sortable.on i{color:var(--blue);}

  /* 그룹 펼치기/접기 행 */
  .grow{display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px dashed var(--line-strong);border-radius:9px;background:var(--panel);
    padding:7px 0;font-size:12px;color:var(--muted-2);cursor:pointer;user-select:none;}
  .grow:hover{background:#eef1f4;color:var(--text);border-color:var(--blue);}
  .grow b{color:var(--blue);font-weight:700;}
  .gcount{display:inline-block;font-size:10px;font-weight:700;color:var(--blue);
    background:var(--blue-soft);border-radius:4px;padding:0 5px;margin-left:5px;line-height:16px;vertical-align:1px;}

  /* 컬럼 폭 (헤더/행 공통) */
  .c-cat{flex:0 0 74px;padding:0 6px;}
  .c-comp{flex:0 0 92px;padding:0 6px;}
  .c-img{flex:0 0 56px;}
  .c-main{flex:1 1 auto;min-width:190px;padding:0 10px;text-align:center;}
  .c-spec{flex:0 0 148px;padding:0 8px;}
  .c-pkg{flex:0 0 76px;padding:0 6px;}
  .c-price{flex:0 0 120px;padding:0 8px;}
  .c-act{flex:0 0 62px;}

  /* 공통 요소 */
  .thumb{position:relative;background:var(--panel);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .thumb img{width:100%;height:100%;object-fit:contain;}
  .thumb .noimg{color:var(--muted);font-size:10px;text-align:center;}
  .nm{font-size:13.5px;font-weight:600;letter-spacing:-0.2px;word-break:keep-all;line-height:1.4;}
  .codechip{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:var(--muted);
    cursor:pointer;border:1px dashed var(--line-strong);border-radius:5px;padding:0 6px;line-height:18px;
    font-variant-numeric:tabular-nums;user-select:none;}
  .codechip:hover{color:var(--blue);border-color:var(--blue);}
  .brand{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;}
  .spec-txt{font-size:12px;color:var(--muted-2);word-break:keep-all;line-height:1.35;text-align:center;}
  .pkg-txt{font-size:12px;color:var(--muted-2);text-align:center;white-space:nowrap;}
  .p-mem{font-size:14.5px;font-weight:800;color:var(--blue);letter-spacing:-0.3px;white-space:nowrap;}
  .p-mem small{font-size:10px;font-weight:700;color:#fff;background:var(--blue);
    border-radius:4px;padding:1px 4px;margin-right:3px;vertical-align:1px;}
  .p-list{font-size:11.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .p-list.struck{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:11px;}
  .p-real{font-size:11px;color:var(--red);font-weight:700;white-space:nowrap;}
  .p-none{font-size:12px;color:var(--muted);white-space:nowrap;}
  .iconbtn{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:0;}
  .iconbtn:hover{background:var(--hover);color:var(--blue);}
  .iconbtn svg{width:16px;height:16px;}
  .favheart{color:var(--muted);}
  .favheart.on{color:var(--pink);}
  .favheart.on svg{fill:var(--pink);}

  /* 목록형 행 */
  .grid.viewlist{display:flex;flex-direction:column;gap:6px;min-width:940px;}
  .viewlist .card{border:1px solid var(--line);border-radius:9px;background:#fff;
    display:flex;flex-direction:row;align-items:center;transition:.12s;padding:6px 0;cursor:pointer;}
  .viewlist .card:hover{border-color:var(--line-strong);box-shadow:0 3px 12px rgba(0,0,0,.05);}
  .viewlist .thumb{width:46px;height:46px;border-radius:6px;margin:0 auto;cursor:zoom-in;}
  .viewlist .c-cat{font-size:11px;color:var(--muted);word-break:keep-all;line-height:1.3;text-align:center;}
  .viewlist .c-comp{text-align:center;}
  .comp-txt{font-size:12px;color:var(--muted-2);word-break:keep-all;line-height:1.3;}
  .comp-ct{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .shop-tag{display:inline-block;font-size:9.5px;border-radius:4px;padding:0 5px;margin-top:3px;line-height:16px;}
  .shop-edent{background:var(--blue-soft);color:var(--blue);}
  .shop-seil{background:#e6fcf5;color:#0ca678;}
  mark{background:#ffe8a3;color:inherit;padding:0 1px;border-radius:3px;}
  .viewlist .c-price{display:flex;flex-direction:column;align-items:flex-end;gap:0;text-align:right;}
  .viewlist .c-act{display:flex;align-items:center;justify-content:center;gap:0;}

  /* 이미지 확대 모달 */
  #imgModal{position:fixed;inset:0;background:rgba(17,20,24,.62);display:none;
    align-items:center;justify-content:center;z-index:90;cursor:zoom-out;padding:28px;}
  #imgModal.show{display:flex;}
  #imgModal img{max-width:min(92vw,780px);max-height:86vh;background:#fff;border-radius:14px;
    object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,.35);}

  /* 앨범형 */
  .grid.viewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px;min-width:0;}
  .viewgrid .card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;transition:.12s;cursor:pointer;}
  .viewgrid .card:hover{border-color:var(--line-strong);box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .viewgrid .thumb{width:100%;aspect-ratio:1/1;cursor:zoom-in;}
  .viewgrid .gfav{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.85);border-radius:50%;
    width:30px;height:30px;}
  .viewgrid .info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .viewgrid .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;}
  .viewgrid .sub{font-size:11px;color:var(--muted);word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .viewgrid .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;}
  .viewgrid .price{display:flex;flex-direction:column;gap:1px;}
  .viewgrid .acts{display:flex;gap:1px;}

  .empty{padding:70px 0;text-align:center;color:var(--muted);font-size:14px;}
  #sentinel{height:1px;}
  .loadmore{padding:24px 0;text-align:center;}
  .loadmore button{border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;
    padding:10px 22px;font-size:13px;color:var(--muted-2);cursor:pointer;}
  .loadmore button:hover{background:var(--hover);color:var(--text);}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#2b2f36;color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;
    opacity:0;pointer-events:none;transition:.22s;z-index:99;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
  <div class="left">
  <div class="logo-box">
    <div class="logo-mark">이</div>
    <div class="logo-text">이덴트 카탈로그<span class="meta">총 <b id="totalCount">0</b>개 · <span id="genAt">-</span><br>자료 <a href="https://www.edent.co.kr" target="_blank" rel="noopener" style="color:var(--blue)">edent.co.kr</a></span></div>
  </div>
  <div class="warn" id="memWarn">⚠ 비로그인 크롤 데이터 — 회원가가 비어 있습니다.</div>
  <aside class="side" id="side">
    <button class="side-toggle" id="sideToggle">
      <span>카테고리 필터 <b id="catSel"></b></span><i id="sideArrow">▾</i>
    </button>
    <div class="side-body">
      <div class="side-title">쇼핑몰</div>
      <div class="cats" id="shopChips" style="padding-top:4px;"></div>
      <div class="side-title" style="margin-top:14px;">카테고리</div>
      <div class="cat-tools">
        <button id="catAll">전체 선택</button><button id="catNone">전체 해제</button>
      </div>
      <div class="cats" id="catChips"></div>
    </div>
  </aside>
  </div><!-- /.left -->
  <div class="main">

  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="상품명·규격·코드 검색 (초성 가능)" autocomplete="off">
      <select id="groupMode" title="같은 상품의 규격 묶음 표시 방식">
        <option value="collapse">규격 접기</option>
        <option value="batch">5개씩 보기</option>
        <option value="all">전체 나열</option>
      </select>
      <button class="favbtn" id="favFilter" title="즐겨찾기만 보기">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span id="favCount">0</span>
      </button>
      <div class="viewtoggle">
        <button id="viewListBtn" title="목록형" aria-label="목록형">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="6" y1="5" x2="17" y2="5"/><line x1="6" y1="10" x2="17" y2="10"/><line x1="6" y1="15" x2="17" y2="15"/>
            <circle cx="3" cy="5" r="1.1" fill="currentColor" stroke="none"/><circle cx="3" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="3" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="viewGridBtn" title="앨범형" aria-label="앨범형">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <rect x="2.5" y="2.5" width="6" height="6" rx="1.3"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.3"/>
            <rect x="2.5" y="11.5" width="6" height="6" rx="1.3"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="count">검색 결과 <b id="resultCount">0</b>개</div>

  <div class="table-zone">
    <div class="lhead" id="listHead">
      <div class="c-cat sortable" data-sort="cat">카테고리<i></i></div>
      <div class="c-img">사진</div>
      <div class="c-comp sortable" data-sort="comp">회사<i></i></div>
      <div class="c-main sortable" data-sort="name">상품명<i></i></div>
      <div class="c-spec sortable" data-sort="spec">규격<i></i></div>
      <div class="c-pkg sortable" data-sort="pkg">포장<i></i></div>
      <div class="c-price sortable" data-sort="price">가격<i></i></div>
      <div class="c-act">공유·♥</div>
    </div>
    <div class="grid viewlist" id="grid"></div>
  </div>
  <div class="empty" id="empty" style="display:none;">조건에 맞는 상품이 없습니다.</div>
  <div class="loadmore" id="loadmore" style="display:none;"><button id="loadmoreBtn">더 보기</button></div>
  <div id="sentinel"></div>

  </div><!-- /.main -->
  </div><!-- /.layout -->
</div>
<div id="toast"></div>
<div id="imgModal"><img id="imgModalPic" alt=""></div>

<script src="data.js"></script>
<script>
(function(){
  var DATA=(window.EDENT_DATA)||{items:[],count:0,generatedAt:'',loggedIn:false};
  var items=DATA.items||[];
  var PAGE=60;

  document.getElementById('totalCount').textContent=DATA.count||items.length;
  document.getElementById('genAt').textContent=DATA.generatedAt||'-';
  var anyMember=items.some(function(x){return x.priceMember!=null;});
  if(!anyMember) document.getElementById('memWarn').style.display='block';

  function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function won(n){return n==null?'':n.toLocaleString('ko-KR')+'원';}

  // ----- 토스트 -----
  var toastEl=document.getElementById('toast'), toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1600);
  }
  function copyText(t,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){fallbackCopy(t,msg);});
    }else fallbackCopy(t,msg);
  }
  function fallbackCopy(t,msg){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(msg);}catch(e){toast('복사 실패');}
    document.body.removeChild(ta);
  }

  // ----- 검색 인덱스: 초성 + 구분자 무시 (TR-13 = TR13 = TR 13) -----
  var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function toCho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3)o+=CHO[Math.floor((c-0xAC00)/588)];else o+=s[i];}return o;}
  var SEP_RX=/[\s\-_./·(),*]/;               // 검색 시 무시할 구분자
  var SEP_RX_G=/[\s\-_./·(),*]/g;
  function norm(s){return(s||'').toLowerCase().replace(SEP_RX_G,'');}

  var SHOPS={edent:'이덴트', seil:'세일글로벌'};
  items.forEach(function(x){
    // 필드 정규화 (과거 스키마 origin → company, 샵 기본값)
    x.shop=x.shop||'edent';
    x.company=x.company||x.origin||'';
    x.country=x.country||'';
    if((!x.name||/^\s*$/.test(x.name)) && x.spec) x.name=x.spec;   // 이름 공백 방어
    // 상품명 끝에 규격이 중복으로 붙어 있으면 잘라냄 (목록 원본이 이름+규격 결합 형태)
    if(x.spec && x.name){
      var sp=x.spec.trim(), nmT=x.name.replace(/\s+$/,'');
      if(sp && nmT.length>sp.length && nmT.slice(-sp.length)===sp){
        x.name=nmT.slice(0,nmT.length-sp.length).replace(/\s+$/,'');
      }
    }
    // 키: 샵 네임스페이스 (즐겨찾기·그룹 충돌 방지)
    x._key=x.shop+':'+x.id;
    x._gk=x.shop+':'+((x.gid && x.gid!=='solo')?String(x.gid):'s'+x.id);
    var t=(x.name||'')+'|'+(x.spec||'')+'|'+(x.company||'')+'|'+(x.country||'')+'|'+(x.code||'')+'|'+(x.kw||'');
    x._sn=norm(t);
    x._sc=toCho(x._sn);
  });

  // ----- 검색어 하이라이트 -----
  var curTokens=[];
  function buildNormMap(s){
    var chars=[],map=[];
    for(var i=0;i<s.length;i++){
      var c=s[i].toLowerCase();
      if(SEP_RX.test(c)) continue;
      chars.push(c); map.push(i);
    }
    return {n:chars.join(''),map:map};
  }
  function hl(text){
    text=(text==null?'':String(text));
    if(!curTokens.length||!text) return esc(text);
    var nm=buildNormMap(text);
    if(!nm.n) return esc(text);
    var cho=toCho(nm.n);
    var marks=new Array(text.length);
    var found=false;
    curTokens.forEach(function(tk){
      if(!tk) return;
      [nm.n,cho].forEach(function(hay){
        var idx=0;
        while((idx=hay.indexOf(tk,idx))!==-1){
          var s=nm.map[idx], e=nm.map[idx+tk.length-1];
          for(var i=s;i<=e;i++) marks[i]=true;
          found=true; idx+=1;
        }
      });
    });
    if(!found) return esc(text);
    var out='',buf='',inM=false;
    for(var i=0;i<text.length;i++){
      var m=!!marks[i];
      if(m!==inM){ out+=esc(buf)+(m?'<mark>':'</mark>'); buf=''; inM=m; }
      buf+=text[i];
    }
    out+=esc(buf)+(inM?'</mark>':'');
    return out;
  }

  // ----- 즐겨찾기 -----
  var FAV_KEY='edent_favs';
  var favs=new Set();
  try{ (JSON.parse(localStorage.getItem(FAV_KEY)||'[]')||[]).forEach(function(v){
    v=String(v); if(v.indexOf(':')===-1) v='edent:'+v;   // 구버전 키 마이그레이션
    favs.add(v); }); }catch(e){}
  var favOnly=false;
  var favCountEl=document.getElementById('favCount'), favFilterBtn=document.getElementById('favFilter');
  function saveFavs(){ try{localStorage.setItem(FAV_KEY,JSON.stringify(Array.from(favs)));}catch(e){} }
  function updateFavCount(){ favCountEl.textContent=favs.size; }
  updateFavCount();
  favFilterBtn.addEventListener('click',function(){
    favOnly=!favOnly; favFilterBtn.classList.toggle('on',favOnly); apply();
  });

  // ----- 필터 칩 (쇼핑몰 / 카테고리) : 검색 결과에 맞춰 개수·목록 동적 갱신 -----
  var fShop=new Set(), fCat=new Set();
  var shopChipRefs=[], chipRefs=[];
  items.forEach(function(x){ fShop.add(x.shop); fCat.add(x.cat1||'기타'); });

  function renderChips(contId, counts, sel, refs, labelFn, sortFn){
    var cont=document.getElementById(contId);
    cont.innerHTML=''; refs.length=0;
    Object.keys(counts).sort(sortFn(counts)).forEach(function(v){
      var el=document.createElement('div');
      el.className='chip'+(sel.has(v)?' on':'');
      el.innerHTML=esc(labelFn(v))+' <i>'+counts[v]+'</i>';
      el.addEventListener('click',function(){
        if(sel.has(v)){sel.delete(v);el.classList.remove('on');}
        else{sel.add(v);el.classList.add('on');}
        apply();
      });
      refs.push({v:v,el:el});
      cont.appendChild(el);
    });
  }
  // 패싯: 자기 축은 제외하고 다른 필터만 적용한 개수 (표준 패싯 방식)
  function updateFacets(base){
    var shopCounts={}, catCounts={};
    base.forEach(function(x){
      var c=x.cat1||'기타';
      if(fCat.has(c)) shopCounts[x.shop]=(shopCounts[x.shop]||0)+1;
      if(fShop.has(x.shop)) catCounts[c]=(catCounts[c]||0)+1;
    });
    renderChips('shopChips', shopCounts, fShop, shopChipRefs,
      function(v){return SHOPS[v]||v;}, function(m){return function(a,b){return m[b]-m[a];};});
    renderChips('catChips', catCounts, fCat, chipRefs,
      function(v){return v;}, function(m){return function(a,b){return m[b]-m[a];};});
  }
  document.getElementById('catAll').addEventListener('click',function(){
    items.forEach(function(x){fCat.add(x.cat1||'기타');}); apply();});
  document.getElementById('catNone').addEventListener('click',function(){
    fCat.clear(); apply();});

  // 모바일 접이식 사이드바 (기본 접힘)
  document.getElementById('sideToggle').addEventListener('click',function(){
    document.getElementById('side').classList.toggle('open');
  });
  function updateCatSel(){
    var el=document.getElementById('catSel');
    if(el) el.textContent=fCat.size+'/'+chipRefs.length;
  }

  // ----- 필터/정렬 -----
  var q='', sortKey='name', sortDir=1;      // dir 1=오름차순, -1=내림차순
  var groupMode='collapse';                  // collapse | batch | all
  var expanded=new Set();                    // 펼친 그룹 키
  var grid=document.getElementById('grid'), empty=document.getElementById('empty'),
      resultCount=document.getElementById('resultCount'),
      loadmore=document.getElementById('loadmore'),
      listHead=document.getElementById('listHead');
  var filtered=[], display=[], shown=0;

  function mainPrice(x){
    if(x.priceMember!=null && x.priceMember>0) return x.priceMember;
    if(x.priceReal!=null && x.priceReal>0) return x.priceReal;
    if(x.priceList!=null && x.priceList>0) return x.priceList;
    return null;
  }
  function priceKey(x){var p=mainPrice(x);return p==null?Infinity:p;}

  // 그룹 최저가 (그룹 연속 정렬용 대표값)
  var gmin={};
  items.forEach(function(x){var p=priceKey(x);
    if(!(x._gk in gmin)||p<gmin[x._gk]) gmin[x._gk]=p;});
  function specCmp(a,b){return (a.spec||'').localeCompare(b.spec||'','ko',{numeric:true});}
  function gkCmp(a,b){return a._gk<b._gk?-1:(a._gk>b._gk?1:0);}
  function gminCmp(a,b){var x=gmin[a._gk],y=gmin[b._gk];return x===y?0:(x<y?-1:1);}

  // 검색어/즐겨찾기만 적용한 1차 후보 (패싯 카운트 계산용)
  function baseMatch(x,tokens){
    if(favOnly && !favs.has(x._key)) return false;
    for(var i=0;i<tokens.length;i++){
      var tk=tokens[i];
      if(x._sn.indexOf(tk)===-1 && x._sc.indexOf(tk)===-1) return false;
    }
    return true;
  }
  function txtKey(v){return (v==null?'':String(v));}
  function cmpBy(key,a,b){
    if(key==='price'){var x=priceKey(a),y=priceKey(b);return x===y?0:(x<y?-1:1);}
    if(key==='cat')  return txtKey(a.cat1).localeCompare(txtKey(b.cat1),'ko');
    if(key==='comp') return txtKey(a.company).localeCompare(txtKey(b.company),'ko');
    if(key==='spec') return txtKey(a.spec).localeCompare(txtKey(b.spec),'ko',{numeric:true});
    if(key==='pkg')  return txtKey(a.pkg).localeCompare(txtKey(b.pkg),'ko',{numeric:true});
    return txtKey(a.name).localeCompare(txtKey(b.name),'ko');
  }
  // 그룹 대표값(그룹 연속 유지용): 가격은 그룹 최저가, 그 외는 그룹 첫 항목 기준
  var grep={};
  function groupRep(x){return grep[x._gk]||x;}

  function compute(){
    var tokens=q.trim().split(/\s+/).map(norm).filter(Boolean);
    curTokens=tokens;
    var base=items.filter(function(x){return baseMatch(x,tokens);});
    updateFacets(base);
    filtered=base.filter(function(x){
      return fShop.has(x.shop) && fCat.has(x.cat1||'기타');
    });
    // 그룹 대표 재계산 (현재 결과 기준)
    grep={};
    filtered.forEach(function(x){
      var r=grep[x._gk];
      if(!r) { grep[x._gk]=x; return; }
      if(priceKey(x)<priceKey(r)) grep[x._gk]=x;
    });
    // 동일 그룹은 항상 연속 배치: (그룹대표 정렬키 → 그룹 → 규격)
    filtered.sort(function(a,b){
      var d=cmpBy(sortKey,groupRep(a),groupRep(b))*sortDir; if(d) return d;
      var g=gkCmp(a,b); if(g) return g;
      return specCmp(a,b);
    });
    resultCount.textContent=filtered.length;
    buildDisplay();
  }

  // 그룹 표시 방식에 따라 실제 렌더 목록 구성
  function buildDisplay(){
    display=[];
    var i=0;
    while(i<filtered.length){
      var gk=filtered[i]._gk, j=i;
      while(j<filtered.length && filtered[j]._gk===gk) j++;
      var members=filtered.slice(i,j), n=members.length;
      if(n===1 || groupMode==='all' || expanded.has(gk)){
        members.forEach(function(m){display.push({t:'item',x:m});});
        if(n>1 && groupMode!=='all') display.push({t:'fold',gk:gk,n:n});
      } else if(groupMode==='batch'){
        var show=Math.min(5,n);
        for(var k=0;k<show;k++) display.push({t:'item',x:members[k]});
        if(n>show) display.push({t:'more',gk:gk,n:n-show});
      } else { // collapse
        display.push({t:'item',x:members[0],gn:n});
        display.push({t:'more',gk:gk,n:n-1});
      }
      i=j;
    }
  }

  // ----- 공용 조각 -----
  var SVG_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var SVG_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
  var SVG_HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  function bigImg(x){return 'https://www.edent.co.kr/data/product/img_b1_'+x.id;}
  function thumbHTML(x){
    return '<div class="thumb act-img" data-big="'+esc(bigImg(x))+'" data-fallback="'+esc(x.img)+'" title="사진 크게 보기">'+
      '<img loading="lazy" src="'+esc(x.img)+'" alt="" '+
        'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'+
      '<span class="noimg" style="display:none">이미지<br>없음</span></div>';
  }
  function priceHTML(x){
    var list=x.priceList, real=x.priceReal, main=mainPrice(x);
    var isMember=(x.priceMember!=null && x.priceMember>0 && main===x.priceMember);
    if(main==null) return '<div class="p-none">가격 문의</div>';
    var out='<div class="p-mem">'+(isMember?'<small>회원</small>':'')+won(main)+'</div>';
    if(list!=null && list>main) out+='<div class="p-list struck">정가 '+won(list)+'</div>';
    if(real!=null && real>0 && real<main) out+='<div class="p-real">실구매 '+won(real)+'</div>';
    return out;
  }
  function actHTML(x){
    return '<button class="iconbtn act-share" data-url="'+esc(x.url)+'" title="링크 복사(공유)">'+SVG_SHARE+'</button>';
  }
  function favBtnHTML(x,extra){
    var on=favs.has(x._key);
    return '<button class="iconbtn favheart'+(on?' on':'')+(extra?' '+extra:'')+'" data-fav="'+esc(x._key)+'" title="즐겨찾기">'+SVG_HEART+'</button>';
  }
  function codeHTML(x){ return ''; }   // 상품코드 표기 제거 (검색 색인에는 유지)

  // ----- 목록형 행 -----
  function compLabel(x){
    var s=x.company||'';
    if(x.country) s+=(s?' · ':'')+x.country;
    return s;
  }
  function rowHTML(x,gn){
    return '<div class="card" data-url="'+esc(x.url)+'">'+
      '<div class="c-cat">'+esc(x.cat1||'')+
        '<br><span class="shop-tag shop-'+esc(x.shop)+'">'+esc(SHOPS[x.shop]||x.shop)+'</span></div>'+
      '<div class="c-img">'+thumbHTML(x)+'</div>'+
      '<div class="c-comp"><div class="comp-txt">'+(x.company?hl(x.company):'-')+'</div>'+
        (x.country?'<div class="comp-ct">'+esc(x.country)+'</div>':'')+'</div>'+
      '<div class="c-main"><div class="nm">'+hl(x.name)+
        (gn>1?'<span class="gcount">규격 '+gn+'</span>':'')+'</div>'+codeHTML(x)+'</div>'+
      '<div class="c-spec"><div class="spec-txt">'+(x.spec?hl(x.spec):'-')+'</div></div>'+
      '<div class="c-pkg"><div class="pkg-txt">'+esc(x.pkg||'-')+'</div></div>'+
      '<div class="c-price">'+priceHTML(x)+'</div>'+
      '<div class="c-act">'+actHTML(x)+favBtnHTML(x)+'</div>'+
    '</div>';
  }

  // ----- 앨범형 카드 -----
  function cardHTML(x){
    var subParts=[];
    if(x.spec) subParts.push(esc(x.spec));
    if(x.pkg) subParts.push(esc(x.pkg));
    var cl=compLabel(x);
    if(cl) subParts.push('<b>'+esc(cl)+'</b>');
    return '<div class="card" data-url="'+esc(x.url)+'">'+
      '<div class="thumb">'+
        '<img loading="lazy" src="'+esc(x.img)+'" alt="" '+
          'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">'+
        '<span class="noimg" style="display:none">이미지 없음</span>'+
        favBtnHTML(x,'gfav')+
      '</div>'+
      '<div class="info">'+
        '<div class="nm">'+hl(x.name)+'</div>'+
        codeHTML(x)+
        (subParts.length?'<div class="sub">'+subParts.join(' · ')+'</div>':'')+
        '<div class="foot"><div class="price">'+priceHTML(x)+'</div>'+
        '<div class="acts">'+actHTML(x)+'</div></div>'+
      '</div></div>';
  }

  // ----- 렌더 -----
  var viewMode='list';
  function entryHTML(e){
    if(e.t==='item') return viewMode==='list'?rowHTML(e.x,e.gn):cardHTML(e.x);
    if(e.t==='more') return '<div class="grow" data-exp="'+esc(e.gk)+'">▾ 규격 <b>'+e.n+'</b>개 더 보기</div>';
    return '<div class="grow" data-fold="'+esc(e.gk)+'">▴ 규격 '+e.n+'개 접기</div>';
  }
  function renderMore(){
    var next=display.slice(shown, shown+PAGE);
    grid.insertAdjacentHTML('beforeend', next.map(entryHTML).join(''));
    shown+=next.length;
    loadmore.style.display=(shown<display.length)?'block':'none';
  }
  function apply(){
    compute();
    updateCatSel();
    grid.innerHTML=''; shown=0;
    empty.style.display=filtered.length?'none':'block';
    renderMore();
  }

  // ----- 이미지 확대 모달 -----
  var imgModal=document.getElementById('imgModal'), imgModalPic=document.getElementById('imgModalPic');
  imgModal.addEventListener('click',function(){imgModal.classList.remove('show');imgModalPic.src='';});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')imgModal.classList.remove('show');});

  // ----- 클릭 위임 (사진확대/코드복사/공유/하트 → 그 외는 상세페이지 새탭) -----
  document.addEventListener('click',function(e){
    var expEl=e.target.closest('[data-exp]');
    if(expEl){ expanded.add(expEl.dataset.exp); buildDisplay();
      grid.innerHTML=''; shown=0; renderMore(); return; }
    var foldEl=e.target.closest('[data-fold]');
    if(foldEl){ expanded.delete(foldEl.dataset.fold); buildDisplay();
      grid.innerHTML=''; shown=0; renderMore(); return; }
    var imgEl=e.target.closest('.act-img');
    if(imgEl){
      imgModalPic.onerror=function(){ this.onerror=null; this.src=imgEl.dataset.fallback; };
      imgModalPic.src=imgEl.dataset.big;
      imgModal.classList.add('show');
      return;
    }
    var codeEl=e.target.closest('.act-code');
    if(codeEl){ copyText(codeEl.dataset.code,'상품코드 복사됨: '+codeEl.dataset.code); return; }
    var shareEl=e.target.closest('.act-share');
    if(shareEl){ copyText(shareEl.dataset.url,'상품 링크가 복사되었습니다'); return; }
    var favEl=e.target.closest('[data-fav]');
    if(favEl){
      var id=String(favEl.dataset.fav);
      if(favs.has(id)){favs.delete(id);favEl.classList.remove('on');}
      else{favs.add(id);favEl.classList.add('on');}
      saveFavs(); updateFavCount();
      if(favOnly) apply();
      return;
    }
    // 나머지 행 영역 클릭 → 이덴트 상세페이지 새탭
    var card=e.target.closest('.card');
    if(card && card.dataset.url){ window.open(card.dataset.url,'_blank','noopener'); }
  });

  // ----- 무한 스크롤 -----
  var io=new IntersectionObserver(function(es){
    if(es[0].isIntersecting && shown<filtered.length) renderMore();
  },{rootMargin:'600px'});
  io.observe(document.getElementById('sentinel'));
  document.getElementById('loadmoreBtn').addEventListener('click',renderMore);

  // ----- 검색/정렬 -----
  var qEl=document.getElementById('q'), t=null;
  qEl.addEventListener('input',function(){q=qEl.value;if(t)clearTimeout(t);t=setTimeout(apply,160);});
  // 그룹 표시 방식
  document.getElementById('groupMode').addEventListener('change',function(e){
    groupMode=e.target.value; expanded.clear();
    try{localStorage.setItem('edent_gmode',groupMode);}catch(err){}
    apply();
  });
  try{ var gm=localStorage.getItem('edent_gmode');
    if(gm){ groupMode=gm; document.getElementById('groupMode').value=gm; } }catch(err){}

  // 머릿행 클릭 정렬 (같은 열 재클릭 → 오름/내림 전환)
  function markSort(){
    Array.prototype.forEach.call(listHead.querySelectorAll('.sortable'),function(th){
      var on=(th.dataset.sort===sortKey);
      th.classList.toggle('on',on);
      th.querySelector('i').textContent=on?(sortDir===1?'▲':'▼'):'↕';
    });
  }
  Array.prototype.forEach.call(listHead.querySelectorAll('.sortable'),function(th){
    th.addEventListener('click',function(){
      var k=th.dataset.sort;
      if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=1; }
      markSort(); apply();
    });
  });
  markSort();

  // ----- 뷰 모드 (목록형 기본) -----
  var VIEW_KEY='edent_view';
  var listBtn=document.getElementById('viewListBtn'), gridBtn=document.getElementById('viewGridBtn');
  function setView(mode){
    viewMode=(mode==='grid')?'grid':'list';
    var isList=(viewMode==='list');
    grid.classList.toggle('viewlist',isList);
    grid.classList.toggle('viewgrid',!isList);
    listHead.style.display=isList?'flex':'none';
    listBtn.classList.toggle('on',isList);
    gridBtn.classList.toggle('on',!isList);
    try{localStorage.setItem(VIEW_KEY,viewMode);}catch(e){}
    apply();
  }
  listBtn.addEventListener('click',function(){setView('list');});
  gridBtn.addEventListener('click',function(){setView('grid');});
  var savedView='list'; try{savedView=localStorage.getItem(VIEW_KEY)||'list';}catch(e){}
  setView(savedView);
})();
</script>
</body>
