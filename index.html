<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이덴트 상품 카탈로그</title>
<style>
  :root{
    --bg:#ffffff;--panel:#f7f8fa;--line:#eaecef;--line-strong:#d9dde2;
    --text:#191f28;--muted:#8b95a1;--muted-2:#6b7684;--hover:#f4f6f8;
    --blue:#3182f6;--blue-soft:#e8f1ff;--red:#f04452;--pink:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html{scrollbar-gutter:stable;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
    color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px 80px;}

  /* 좌측 사이드바 레이아웃 */
  .layout{display:flex;gap:22px;align-items:flex-start;margin-top:16px;}
  .left{flex:0 0 208px;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .logo-box{display:flex;gap:10px;align-items:flex-start;padding:6px 2px 0;}
  .logo-mark{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;}
  .logo-text{font-size:15px;font-weight:800;letter-spacing:-0.3px;line-height:1.25;padding-top:1px;}
  .logo-text .meta{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.5;}
  .logo-text .meta b{color:var(--muted-2);font-weight:600;}
  .warn{color:var(--red);font-size:12px;display:none;padding:0 2px;}
  .side{position:sticky;top:12px;max-height:calc(100vh - 28px);overflow-y:auto;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;}
  .side-title{font-size:13px;font-weight:800;margin-bottom:8px;letter-spacing:-0.2px;}
  .side-toggle{display:none;}
  .main{flex:1;min-width:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* 검색/정렬/즐겨찾기/뷰 스티키 바 */
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 0 10px;
    border-bottom:1px solid var(--line);}
  .search{display:flex;gap:8px;align-items:center;}
  .search input{flex:1;min-width:0;height:44px;border:1px solid var(--line-strong);border-radius:12px;
    padding:0 14px;font-size:15px;outline:none;background:var(--panel);}
  .search input:focus{border-color:var(--blue);background:#fff;}
  .search select{height:44px;border:1px solid var(--line-strong);border-radius:12px;padding:0 10px;
    font-size:13px;background:var(--panel);color:var(--muted-2);outline:none;cursor:pointer;}
  .favbtn{height:44px;border:1px solid var(--line-strong);border-radius:12px;padding:0 13px;
    background:var(--panel);color:var(--muted-2);font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .favbtn svg{width:16px;height:16px;}
  .favbtn.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  .viewtoggle{flex:0 0 auto;display:flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;}
  .viewtoggle button{width:42px;height:44px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:none;cursor:pointer;color:var(--muted);}
  .viewtoggle button+button{border-left:1px solid var(--line-strong);}
  .viewtoggle button.on{background:var(--blue);color:#fff;}
  .viewtoggle svg{width:18px;height:18px;}

  /* 카테고리 칩 (사이드바 세로 배열, 선택 = 차분한 강조) */
  .cats{display:flex;flex-direction:column;gap:3px;padding:10px 0 2px;}
  .chip{display:flex;align-items:center;gap:7px;font-size:12.5px;
    color:#b4bcc6;border:1px solid transparent;border-radius:8px;padding:6px 9px;cursor:pointer;
    user-select:none;background:none;transition:.12s;word-break:keep-all;}
  .chip::before{content:'';flex:0 0 auto;width:6px;height:6px;border-radius:50%;
    background:var(--line-strong);transition:.12s;}
  .chip i{color:#c8ced6;font-style:normal;font-size:10.5px;flex:0 0 auto;margin-left:auto;}
  .chip:hover{background:#fff;}
  .chip.on{background:#fff;border-color:var(--line);color:var(--text);}
  .chip.on::before{background:var(--blue);}
  .chip.on i{color:var(--muted);}
  .cat-tools{display:flex;gap:6px;align-items:center;}
  .cat-tools button{font-size:11.5px;color:var(--muted-2);background:var(--bg);border:1px solid var(--line-strong);
    border-radius:6px;padding:4px 9px;cursor:pointer;}
  .cat-tools button:hover{background:var(--hover);color:var(--text);}
  .side-title b{font-weight:600;color:var(--blue);font-size:11px;margin-left:3px;}
  .side-search{width:100%;height:28px;border:1px solid var(--line-strong);border-radius:7px;
    padding:0 8px;font-size:12px;background:#fff;outline:none;margin-top:6px;}
  .side-search:focus{border-color:var(--blue);}
  .lnk-clear{width:100%;margin-top:6px;font-size:11.5px;color:var(--muted-2);background:var(--bg);
    border:1px solid var(--line-strong);border-radius:6px;padding:4px 0;cursor:pointer;}
  .lnk-clear:hover{background:var(--hover);color:var(--text);}

  /* 모바일: 사이드바 → 접이식 (기본 접힘) */
  @media (max-width:860px){
    .layout{flex-direction:column;gap:10px;margin-top:10px;}
    .left{flex:none;width:100%;gap:10px;}
    .side{position:static;width:100%;max-height:none;padding:0;overflow:visible;}
    .side-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
      background:none;border:none;cursor:pointer;padding:11px 14px;font-size:13px;font-weight:700;
      color:var(--text);}
    .side-toggle b{color:var(--blue);font-weight:700;margin-left:4px;}
    .side-toggle i{font-style:normal;color:var(--muted);transition:transform .15s;}
    .side.open .side-toggle i{transform:rotate(180deg);}
    .side-body{display:none;padding:0 14px 14px;}
    .side.open .side-body{display:block;}
    .side-title{display:none;}
  }

  /* 회사 칩 바 (검색 결과 수 아래) — 스크롤 없이 줄바꿈, 넘치면 전체보기 모달 */
  .compbar{display:none;gap:5px;padding:2px 0 10px;align-items:stretch;flex-wrap:wrap;}
  .compbar.on{display:flex;}
  .compbar .lbl{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--muted);
    align-self:center;padding-right:2px;}
  .cpill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11.5px;color:var(--muted-2);border:1px solid var(--line);border-radius:9px;
    padding:3px 10px;cursor:pointer;background:#fff;white-space:nowrap;transition:.12s;line-height:1.15;}
  .cpill:hover{border-color:var(--line-strong);color:var(--text);}
  .cpill i{font-style:normal;font-size:10px;color:var(--muted);}
  .cpill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
  .cpill.on i{color:#cfe0ff;}
  .cpill.clear{border-style:dashed;color:var(--muted);justify-content:center;}
  .cpill.more{border-style:dashed;border-color:var(--blue);color:var(--blue);font-weight:600;}

  /* 회사 전체보기 모달 */
  #compModal{position:fixed;inset:0;background:rgba(17,20,24,.45);display:none;
    align-items:center;justify-content:center;z-index:95;padding:20px;}
  #compModal.show{display:flex;}
  .cm-box{background:#fff;border-radius:14px;width:min(94vw,660px);max-height:82vh;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.28);overflow:hidden;}
  .cm-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .cm-head h3{margin:0;font-size:15px;font-weight:800;flex:0 0 auto;}
  .cm-head input{flex:1;height:34px;border:1px solid var(--line-strong);border-radius:8px;
    padding:0 10px;font-size:13px;outline:none;background:var(--panel);}
  .cm-head input:focus{border-color:var(--blue);background:#fff;}
  .cm-x{flex:0 0 auto;width:30px;height:30px;border:none;background:none;cursor:pointer;
    font-size:17px;color:var(--muted);border-radius:8px;}
  .cm-x:hover{background:var(--hover);color:var(--text);}
  .cm-body{padding:12px 16px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;
    align-items:start;}
  .cm-col-h{font-size:12px;font-weight:800;color:var(--muted-2);padding:0 0 7px;
    border-bottom:1px solid var(--line);margin-bottom:8px;}
  .cm-col-h b{color:var(--blue);font-weight:700;font-size:11px;margin-left:3px;}
  .cm-col-list{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;}
  .cm-none{color:var(--muted);font-size:12.5px;padding:6px 2px;}
  @media (max-width:560px){ .cm-body{grid-template-columns:1fr;} }
  .cm-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;
    padding:11px 16px;border-top:1px solid var(--line);background:var(--panel);}
  .cm-foot span{font-size:12px;color:var(--muted);}
  .cm-foot button{font-size:12.5px;border:1px solid var(--line-strong);background:#fff;
    border-radius:8px;padding:6px 14px;cursor:pointer;}
  .cm-foot button:hover{background:var(--hover);}
  .cm-foot .primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}

  .count{padding:14px 2px 10px;font-size:12.5px;color:var(--muted);}
  .count b{color:var(--text);font-weight:700;}

  /* 표 영역 (좁은 화면은 가로 스크롤) */
  .table-zone{overflow-x:auto;}

  /* 목록형 헤더 행 */
  .lhead{display:flex;align-items:center;gap:0;min-width:920px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;
    font-size:12px;font-weight:700;color:var(--muted-2);padding:8px 0;margin-bottom:8px;}
  .lhead>div{text-align:center;}
  .lhead .sortable{cursor:pointer;user-select:none;border-radius:6px;}
  .lhead .sortable:hover{background:#eef1f4;color:var(--text);}
  .lhead .sortable i{font-style:normal;font-size:9px;color:var(--line-strong);margin-left:3px;}
  .lhead .sortable.on{color:var(--blue);}
  .lhead .sortable.on i{color:var(--blue);}

  .gcount{display:inline-block;font-size:10px;font-weight:700;color:var(--blue);
    background:var(--blue-soft);border-radius:4px;padding:0 5px;margin-left:5px;line-height:16px;vertical-align:1px;}

  /* ===== A. 표형(table): 박스 없이 연속 표, 자식 규격은 들여쓰기 ===== */
  .viewlist.m-table{gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .m-table .grp+.grp{border-top:1px solid var(--line);}
  .m-table .card{border:0;border-radius:0;background:none;box-shadow:none;padding:7px 0;}
  .m-table .card:hover{background:var(--hover);box-shadow:none;}
  .m-table .kids{display:none;background:#fbfcfd;border-top:1px dashed var(--line);}
  .m-table .grp.open .kids{display:block;}
  .m-table .kid{padding:5px 0;border-left:3px solid var(--blue-soft);}
  .m-table .kid+.kid{border-top:1px solid #f1f3f5;}
  .m-table .kid .c-cat,.m-table .kid .c-comp{visibility:hidden;}
  .m-table .kid .thumb{width:30px;height:30px;opacity:.75;}
  .m-table .kid .nm{display:none;}
  .m-table .kid .c-spec .spec-txt{font-weight:600;color:var(--text);}
  .caret{display:inline-block;width:15px;font-size:9px;color:var(--muted);transition:transform .15s;}
  .grp.open .caret{transform:rotate(90deg);color:var(--blue);}

  /* ===== B. 칩형(chips): 한 그룹 = 딱 한 줄, 규격은 칩으로 ===== */
  .viewlist.m-chips{gap:5px;}
  .m-chips .card{align-items:stretch;}
  .m-chips .c-spec{flex:0 0 250px;display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;}
  .specchip{font-size:10.5px;line-height:18px;padding:0 6px;border:1px solid var(--line);border-radius:5px;
    color:var(--muted-2);background:#fff;cursor:pointer;white-space:nowrap;}
  .specchip:hover{border-color:var(--blue);color:var(--blue);}
  .specchip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
  .specmore{font-size:10.5px;line-height:18px;padding:0 6px;color:var(--muted);cursor:pointer;
    border:1px dashed var(--line-strong);border-radius:5px;}
  .specmore:hover{color:var(--blue);border-color:var(--blue);}

  /* ===== C. 아코디언(accordion): 그룹 = 카드 한 장, 내부에 규격 미니표 ===== */
  .viewlist.m-acc{gap:8px;}
  .m-acc .grp{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;transition:.12s;}
  .m-acc .grp:hover{border-color:var(--line-strong);box-shadow:0 3px 12px rgba(0,0,0,.05);}
  .m-acc .grp.open{border-color:var(--blue);box-shadow:0 3px 14px rgba(49,130,246,.10);}
  .m-acc .card{border:0;border-radius:0;background:none;box-shadow:none;}
  /* 펼친 규격 행: 대표행과 같은 열 위치를 그대로 사용 */
  .m-acc .kids{display:none;border-top:1px dashed var(--line);background:#fbfcfd;}
  .m-acc .grp.open .kids{display:block;}
  /* 6행까지만 보이고 넘치면 스크롤 — 위아래를 흐리게 해 더 있음을 알림 */
  .m-acc .grp.open .kids.scroll{max-height:212px;overflow-y:auto;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);}
  .m-acc .kids.scroll::-webkit-scrollbar{width:6px;}
  .m-acc .kids.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}

  /* 펼치면 대표행의 포장·가격은 '-' 로 (실제 값은 아래 목록에 있음) */
  .lead .pdash{display:none;color:var(--muted);font-size:12px;}
  .grp.open .lead .pv{display:none;}
  .grp.open .lead .pdash{display:block;}
  .m-acc .kid{padding:4px 0;}
  .m-acc .kid+.kid{border-top:1px solid #f1f3f5;}
  .m-acc .kid:hover{background:var(--hover);}
  .m-acc .kid .c-cat,.m-acc .kid .c-comp,.m-acc .kid .nm{visibility:hidden;}
  .m-acc .kid .thumb{width:30px;height:30px;opacity:.8;}
  .m-acc .kid .c-spec .spec-txt{font-weight:600;color:var(--text);}

  /* 규격 열: 대표규격 / 외 N / 펼침버튼 — 모두 가운데 정렬 */
  .viewlist .c-spec{text-align:center;}
  .spec-etc{font-size:11px;color:var(--muted);margin-top:1px;text-align:center;}
  .spec-btn{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--blue);
    background:var(--blue-soft);border-radius:5px;padding:1px 9px;cursor:pointer;user-select:none;
    line-height:17px;}
  .spec-btn:hover{background:var(--blue);color:#fff;}
  .grp.open .spec-btn{background:var(--panel);color:var(--muted-2);}
  .grp.open .spec-btn:hover{background:var(--line-strong);color:var(--text);}

  /* 펼침 버튼 스타일 변형 */
  .xs-chev .spec-btn,.xs-chev2 .spec-btn,.xs-dots .spec-btn{
    background:none;color:var(--muted);padding:0 8px;font-size:13px;letter-spacing:-1px;}
  .xs-chev .spec-btn:hover,.xs-chev2 .spec-btn:hover,.xs-dots .spec-btn:hover{
    background:var(--blue-soft);color:var(--blue);}
  .xs-chev2 .spec-btn{line-height:9px;padding:3px 8px;}
  .xs-count .spec-btn{background:none;border:1px solid var(--line);color:var(--muted-2);padding:0 8px;}
  .xs-count .spec-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}
  .grp.open .xs-chev .spec-btn,.grp.open .xs-chev2 .spec-btn{color:var(--blue);}

  /* 그룹 요약(가격 범위/규격 수) */
  .grange{font-size:10.5px;color:var(--muted);font-weight:500;}

  /* 컬럼 폭 (헤더/행 공통) */
  .c-cat{flex:0 0 74px;padding:0 6px;}
  .c-comp{flex:0 0 92px;padding:0 6px;}
  .c-img{flex:0 0 56px;}
  .c-main{flex:1 1 auto;min-width:190px;padding:0 10px;text-align:center;}
  .c-spec{flex:0 0 148px;padding:0 8px;}
  .c-pkg{flex:0 0 76px;padding:0 6px;}
  .c-price{flex:0 0 120px;padding:0 8px;}
  .c-act{flex:0 0 62px;}

  /* 공통 요소 */
  .thumb{position:relative;background:var(--panel);overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .thumb img{width:100%;height:100%;object-fit:contain;}
  .thumb .noimg{color:var(--muted);font-size:10px;text-align:center;}
  .nm{font-size:13.5px;font-weight:600;letter-spacing:-0.2px;word-break:keep-all;line-height:1.4;}
  .codechip{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:var(--muted);
    cursor:pointer;border:1px dashed var(--line-strong);border-radius:5px;padding:0 6px;line-height:18px;
    font-variant-numeric:tabular-nums;user-select:none;}
  .codechip:hover{color:var(--blue);border-color:var(--blue);}
  .brand{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;}
  .spec-txt{font-size:12px;color:var(--muted-2);word-break:keep-all;line-height:1.35;text-align:center;}
  .pkg-txt{font-size:12px;color:var(--muted-2);text-align:center;white-space:nowrap;}
  .p-mem{font-size:14.5px;font-weight:800;color:var(--blue);letter-spacing:-0.3px;white-space:nowrap;}
  .p-mem small{font-size:10px;font-weight:700;color:#fff;background:var(--blue);
    border-radius:4px;padding:1px 4px;margin-right:3px;vertical-align:1px;}
  .p-list{font-size:11.5px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .p-list.struck{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:11px;}
  .p-real{font-size:11px;color:var(--red);font-weight:700;white-space:nowrap;}
  .p-none{font-size:12px;color:var(--muted);white-space:nowrap;}
  .iconbtn{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:0;}
  .iconbtn:hover{background:var(--hover);color:var(--blue);}
  .iconbtn svg{width:16px;height:16px;}
  .favheart{color:var(--muted);}
  .favheart.on{color:var(--pink);}
  .favheart.on svg{fill:var(--pink);}

  /* 목록형 행 */
  .grid.viewlist{display:flex;flex-direction:column;gap:6px;min-width:940px;}
  .viewlist .card{border:1px solid var(--line);border-radius:9px;background:#fff;
    display:flex;flex-direction:row;align-items:center;transition:.12s;padding:6px 0;cursor:pointer;}
  .viewlist .card:hover{border-color:var(--line-strong);box-shadow:0 3px 12px rgba(0,0,0,.05);}
  .viewlist .thumb{width:46px;height:46px;border-radius:6px;margin:0 auto;cursor:zoom-in;}
  .viewlist .c-cat{font-size:11px;color:var(--muted);word-break:keep-all;line-height:1.3;text-align:center;}
  .viewlist .c-comp{text-align:center;}
  .comp-txt{font-size:12px;color:var(--muted-2);word-break:keep-all;line-height:1.3;}
  .comp-ct{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .shop-tag{display:inline-block;font-size:9.5px;border-radius:4px;padding:0 5px;margin-top:3px;line-height:16px;}
  .shop-edent{background:var(--blue-soft);color:var(--blue);}
  .shop-seil{background:#e6fcf5;color:#0ca678;}
  mark{background:#ffe8a3;color:inherit;padding:0 1px;border-radius:3px;}
  .viewlist .c-price{display:flex;flex-direction:column;align-items:flex-end;gap:0;text-align:right;}
  .viewlist .c-act{display:flex;align-items:center;justify-content:center;gap:0;}

  /* 이미지 확대 모달 */
  #imgModal{position:fixed;inset:0;background:rgba(17,20,24,.62);display:none;
    align-items:center;justify-content:center;z-index:90;cursor:zoom-out;padding:28px;}
  #imgModal.show{display:flex;}
  #imgModal img{max-width:min(92vw,780px);max-height:86vh;background:#fff;border-radius:14px;
    object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,.35);}

  /* 앨범형 */
  .grid.viewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px;min-width:0;}
  .viewgrid .card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;transition:.12s;cursor:pointer;}
  .viewgrid .card:hover{border-color:var(--line-strong);box-shadow:0 4px 16px rgba(0,0,0,.06);}
  .viewgrid .thumb{width:100%;aspect-ratio:1/1;cursor:zoom-in;}
  .viewgrid .gfav{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.85);border-radius:50%;
    width:30px;height:30px;}
  .viewgrid .info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .viewgrid .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;}
  .viewgrid .sub{font-size:11px;color:var(--muted);word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .viewgrid .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;}
  .viewgrid .price{display:flex;flex-direction:column;gap:1px;}
  .viewgrid .acts{display:flex;gap:1px;}

  /* ===================== 모바일 (≤700px) ===================== */
  @media (max-width:700px){
    .wrap{padding:0 10px 60px;}
    .table-zone{overflow-x:visible;}
    .lhead{display:none !important;}
    .grid.viewlist{min-width:0;gap:7px;}

    /* 행: 사진·카테고리 열 제거하고 2줄로 접기 */
    .viewlist .card{flex-wrap:wrap;align-items:flex-start;padding:9px 11px;row-gap:5px;}
    .viewlist .c-img{display:none;}
    .viewlist .c-cat{flex:0 0 auto;order:1;padding:0;text-align:left;font-size:10.5px;}
    .viewlist .c-cat br{display:none;}
    .viewlist .shop-tag{margin-left:5px;}
    .viewlist .c-main{flex:1 1 100%;order:2;padding:0;text-align:left;min-width:0;}
    .viewlist .nm{font-size:13.5px;}
    .viewlist .c-comp{flex:0 0 auto;order:3;padding:0;text-align:left;}
    .viewlist .comp-txt{font-size:11.5px;}
    .viewlist .comp-ct{display:inline;margin-left:4px;}
    .viewlist .c-spec{flex:1 1 auto;order:4;padding:0 8px;text-align:left;
      display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .viewlist .spec-txt{font-size:11.5px;text-align:left;}
    .viewlist .spec-etc{margin-top:0;font-size:10.5px;}
    .viewlist .spec-btn{margin-top:0;}
    .viewlist .c-pkg{flex:0 0 auto;order:5;padding:0 6px 0 0;}
    .viewlist .pkg-txt{font-size:10.5px;}
    .viewlist .c-price{flex:0 0 auto;order:6;margin-left:auto;padding:0;}
    .viewlist .p-mem{font-size:14px;}
    .viewlist .c-act{flex:0 0 auto;order:7;padding-left:4px;}

    /* 펼친 규격 행도 같은 규칙 */
    .m-acc .kid .c-comp,.m-acc .kid .c-cat,.m-acc .kid .nm{display:none;}
    .m-acc .kid .c-spec{padding-left:10px;}
    .m-table .kid .c-cat,.m-table .kid .c-comp,.m-table .kid .nm{display:none;}

    /* 앨범형: 2열 */
    .grid.viewgrid{grid-template-columns:repeat(2,1fr);gap:9px;}

    /* 상단바: 검색창 한 줄, 나머지 한 줄 */
    .search{flex-wrap:wrap;gap:6px;}
    .search input{flex:1 1 100%;height:40px;font-size:14px;}
    .search select{flex:1 1 auto;height:36px;font-size:12px;}
    .favbtn{height:36px;padding:0 10px;}
    .viewtoggle{border-radius:9px;}
    .viewtoggle button{width:34px;height:36px;}
    header .logo-mark{width:34px;height:34px;flex:0 0 34px;font-size:16px;}
    .logo-text{font-size:14px;}
  }

  .empty{padding:70px 0;text-align:center;color:var(--muted);font-size:14px;}
  #sentinel{height:1px;}
  .loadmore{padding:24px 0;text-align:center;}
  .loadmore button{border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;
    padding:10px 22px;font-size:13px;color:var(--muted-2);cursor:pointer;}
  .loadmore button:hover{background:var(--hover);color:var(--text);}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#2b2f36;color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;
    opacity:0;pointer-events:none;transition:.22s;z-index:99;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<script src="data.js"></script>
<script>
(function(){
  var DATA=(window.EDENT_DATA)||{items:[],count:0,generatedAt:'',loggedIn:false};
  var items=DATA.items||[];
  var PAGE=60;

  document.getElementById('totalCount').textContent=DATA.count||items.length;
  document.getElementById('genAt').textContent=DATA.generatedAt||'-';
  var anyMember=items.some(function(x){return x.priceMember!=null;});
  if(!anyMember) document.getElementById('memWarn').style.display='block';

  function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function won(n){return n==null?'':n.toLocaleString('ko-KR')+'원';}

  // ----- 토스트 -----
  var toastEl=document.getElementById('toast'), toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1600);
  }
  function copyText(t,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){fallbackCopy(t,msg);});
    }else fallbackCopy(t,msg);
  }
  function fallbackCopy(t,msg){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(msg);}catch(e){toast('복사 실패');}
    document.body.removeChild(ta);
  }

  // ----- 검색 인덱스: 초성 + 구분자 무시 (TR-13 = TR13 = TR 13) -----
  var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function toCho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3)o+=CHO[Math.floor((c-0xAC00)/588)];else o+=s[i];}return o;}
  var SEP_RX=/[\s\-_./·(),*]/;               // 검색 시 무시할 구분자
  var SEP_RX_G=/[\s\-_./·(),*]/g;
  function norm(s){return(s||'').toLowerCase().replace(SEP_RX_G,'');}

  var SHOPS={edent:'이덴트', seil:'세일글로벌'};
  // 용량 절약: url과 이덴트 이미지는 데이터에 싣지 않고 id로 계산
  function mkUrl(x){
    return x.shop==='seil'
      ? 'https://www.seilglobal.co.kr/shop/shopdetail.html?branduid='+x.id
      : 'https://www.edent.co.kr/shop/item.php?pd_idx='+x.id;
  }
  function mkImg(x){
    return x.img || 'https://www.edent.co.kr/data/product/img_m1_'+x.id;
  }
  items.forEach(function(x){
    // 필드 정규화 (과거 스키마 origin → company, 샵 기본값)
    x.shop=x.shop||'edent';
    x.company=x.company||x.origin||'';
    x.country=x.country||'';
    if((!x.name||/^\s*$/.test(x.name)) && x.spec) x.name=x.spec;   // 이름 공백 방어
    x.url=x.url||mkUrl(x);
    x.img=mkImg(x);
    // 상품명 끝에 규격이 중복으로 붙어 있으면 잘라냄 (목록 원본이 이름+규격 결합 형태)
    if(x.spec && x.name){
      var sp=x.spec.trim(), nmT=x.name.replace(/\s+$/,'');
      if(sp && nmT.length>sp.length && nmT.slice(-sp.length)===sp){
        x.name=nmT.slice(0,nmT.length-sp.length).replace(/\s+$/,'');
      }
    }
    // 키: 샵 네임스페이스 (즐겨찾기·그룹 충돌 방지)
    x._key=x.shop+':'+x.id;
    x._gk=x.shop+':'+((x.gid && x.gid!=='solo')?String(x.gid):'s'+x.id);
    var t=(x.name||'')+'|'+(x.spec||'')+'|'+(x.company||'')+'|'+(x.country||'')+'|'+(x.code||'')+'|'+(x.kw||'');
    x._sn=norm(t);
    x._sc=toCho(x._sn);
  });

  // ----- 검색어 하이라이트 -----
  var curTokens=[];
  function buildNormMap(s){
    var chars=[],map=[];
    for(var i=0;i<s.length;i++){
      var c=s[i].toLowerCase();
      if(SEP_RX.test(c)) continue;
      chars.push(c); map.push(i);
    }
    return {n:chars.join(''),map:map};
  }
  function hl(text){
    text=(text==null?'':String(text));
    if(!curTokens.length||!text) return esc(text);
    var nm=buildNormMap(text);
    if(!nm.n) return esc(text);
    var cho=toCho(nm.n);
    var marks=new Array(text.length);
    var found=false;
    curTokens.forEach(function(tk){
      if(!tk) return;
      [nm.n,cho].forEach(function(hay){
        var idx=0;
        while((idx=hay.indexOf(tk,idx))!==-1){
          var s=nm.map[idx], e=nm.map[idx+tk.length-1];
          for(var i=s;i<=e;i++) marks[i]=true;
          found=true; idx+=1;
        }
      });
    });
    if(!found) return esc(text);
    var out='',buf='',inM=false;
    for(var i=0;i<text.length;i++){
      var m=!!marks[i];
      if(m!==inM){ out+=esc(buf)+(m?'<mark>':'</mark>'); buf=''; inM=m; }
      buf+=text[i];
    }
    out+=esc(buf)+(inM?'</mark>':'');
    return out;
  }

  // ----- 즐겨찾기 -----
  var FAV_KEY='edent_favs';
  var favs=new Set();
  try{ (JSON.parse(localStorage.getItem(FAV_KEY)||'[]')||[]).forEach(function(v){
    v=String(v); if(v.indexOf(':')===-1) v='edent:'+v;   // 구버전 키 마이그레이션
    favs.add(v); }); }catch(e){}
  var favOnly=false;
  var favCountEl=document.getElementById('favCount'), favFilterBtn=document.getElementById('favFilter');
  function saveFavs(){ try{localStorage.setItem(FAV_KEY,JSON.stringify(Array.from(favs)));}catch(e){} }
  function updateFavCount(){ favCountEl.textContent=favs.size; }
  updateFavCount();
  favFilterBtn.addEventListener('click',function(){
    favOnly=!favOnly; favFilterBtn.classList.toggle('on',favOnly); apply();
  });

  // ----- 필터 칩 (쇼핑몰 / 카테고리) : 검색 결과에 맞춰 개수·목록 동적 갱신 -----
  var fShop=new Set(), fCat=new Set(), fComp=new Set();   // fComp: 비어있으면 전체
  var shopChipRefs=[], chipRefs=[], compChipRefs=[];
  // 기본값: 이덴트만 선택 (세일글로벌은 사용자가 켜서 봄)
  items.forEach(function(x){ fCat.add(x.cat1||'기타'); });
  fShop.add('edent');
  if(!items.some(function(x){return x.shop==='edent';})) items.forEach(function(x){fShop.add(x.shop);});

  function renderChips(contId, counts, sel, refs, labelFn, sortFn){
    var cont=document.getElementById(contId);
    cont.innerHTML=''; refs.length=0;
    Object.keys(counts).sort(sortFn(counts)).forEach(function(v){
      var el=document.createElement('div');
      el.className='chip'+(sel.has(v)?' on':'');
      el.innerHTML=esc(labelFn(v))+' <i>'+counts[v]+'</i>';
      el.addEventListener('click',function(){
        if(sel.has(v)){sel.delete(v);el.classList.remove('on');}
        else{sel.add(v);el.classList.add('on');}
        apply();
      });
      refs.push({v:v,el:el});
      cont.appendChild(el);
    });
  }
  // 패싯: 자기 축은 제외하고 다른 필터만 적용한 개수 (표준 패싯 방식)
  var COMP_TOP=15;
  function updateFacets(base){
    var shopCounts={}, catCounts={}, compCounts={};
    base.forEach(function(x){
      var c=x.cat1||'기타', co=x.company||'';
      var okShop=fShop.has(x.shop), okCat=fCat.has(c), okComp=(fComp.size===0||fComp.has(co));
      if(okCat&&okComp)  shopCounts[x.shop]=(shopCounts[x.shop]||0)+1;
      if(okShop&&okComp) catCounts[c]=(catCounts[c]||0)+1;
      if(okShop&&okCat&&co) compCounts[co]=(compCounts[co]||0)+1;
    });
    renderChips('shopChips', shopCounts, fShop, shopChipRefs,
      function(v){return SHOPS[v]||v;}, function(m){return function(a,b){return m[b]-m[a];};});
    renderChips('catChips', catCounts, fCat, chipRefs,
      function(v){return v;}, function(m){return function(a,b){return m[b]-m[a];};});

    // 회사: 수가 많아 상위 N개 + 검색어 일치 + 이미 선택된 것만 표시
    var cq=norm(document.getElementById('compQ').value||'');
    var names=Object.keys(compCounts);
    if(cq) names=names.filter(function(v){return norm(v).indexOf(cq)!==-1;});
    names.sort(function(a,b){return compCounts[b]-compCounts[a];});
    var show=names.slice(0,COMP_TOP);
    fComp.forEach(function(v){ if(show.indexOf(v)===-1) show.unshift(v); });
    var shown={}; show.forEach(function(v){ shown[v]=compCounts[v]||0; });
    renderChips('compChips', shown, fComp, compChipRefs,
      function(v){return v;}, function(m){return function(a,b){return m[b]-m[a];};});
    var moreN=names.length-COMP_TOP;
    if(moreN>0){
      var el=document.createElement('div');
      el.className='spec-etc'; el.style.textAlign='left'; el.style.padding='3px 9px';
      el.textContent='… 외 '+moreN+'개 (검색으로 찾기)';
      document.getElementById('compChips').appendChild(el);
    }
    document.getElementById('compSel').textContent=fComp.size?fComp.size+'개 선택':'';
    document.getElementById('compClear').style.display=fComp.size?'block':'none';
    renderCompBar(compCounts);
  }

  // 검색 중일 때 결과 수 아래에 회사 칩 노출 (스크롤 없이 줄바꿈, 넘치면 전체보기 모달)
  var lastCompCounts={};
  // 좁은 화면에서 여러 줄로 늘어지지 않도록 노출 개수를 화면 폭에 맞춤
  function barTop(){
    var w=window.innerWidth||1024;
    if(w<=480) return 4;
    if(w<=700) return 6;
    if(w<=980) return 8;
    return 10;
  }
  function pillHTML(v,n){
    return '<span class="cpill'+(fComp.has(v)?' on':'')+'" data-comp="'+esc(v)+'">'+
      esc(v)+'<i>'+n+'</i></span>';
  }
  function renderCompBar(counts){
    lastCompCounts=counts;
    var bar=document.getElementById('compBar');
    var searching=!!q.trim();
    var names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
    fComp.forEach(function(v){ if(names.indexOf(v)===-1) names.unshift(v); });
    if(!searching || names.length<2){ bar.className='compbar'; bar.innerHTML=''; return; }
    bar.className='compbar on';
    var top=barTop();
    var totalN=0; names.forEach(function(v){ totalN+=counts[v]||0; });
    var html='<span class="lbl">회사</span>'+
      '<span class="cpill'+(fComp.size===0?' on':'')+'" data-compclear="1">전체선택<i>'+names.length+'</i></span>';
    names.slice(0,top).forEach(function(v){ html+=pillHTML(v,counts[v]||0); });
    if(names.length>top)
      html+='<span class="cpill more" data-compall="1">전체보기<i>'+names.length+'</i></span>';
    bar.innerHTML=html;
  }
  document.getElementById('compBar').addEventListener('click',function(e){
    if(e.target.closest('[data-compall]')){ openCompModal(); return; }
    if(e.target.closest('[data-compclear]')){ fComp.clear(); apply(); return; }
    var p=e.target.closest('[data-comp]');

    var v=p.dataset.comp;
    if(fComp.has(v)) fComp.delete(v); else fComp.add(v);

  // ----- 회사 전체보기 모달 -----
  var cmEl=document.getElementById('compModal'), cmList=document.getElementById('cmList'),
      cmQ=document.getElementById('cmQ'), cmInfo=document.getElementById('cmInfo');
  function renderCmList(){
    var qq=norm(cmQ.value||'');
    var names=Object.keys(lastCompCounts);
    fComp.forEach(function(v){ if(names.indexOf(v)===-1) names.push(v); });
    if(qq) names=names.filter(function(v){return norm(v).indexOf(qq)!==-1;});
    // 국문(ㄱ~ㅎ) / 영문·기타(A~Z) 2열로 나누고 각각 가나다·알파벳순
    var ko=[], en=[];
    names.forEach(function(v){ (/^[가-힣]/.test(v.trim())?ko:en).push(v); });
    ko.sort(function(a,b){return a.localeCompare(b,'ko');});
    en.sort(function(a,b){return a.toLowerCase().localeCompare(b.toLowerCase(),'en');});
    function col(title,arr){
      return '<div class="cm-col"><div class="cm-col-h">'+title+' <b>'+arr.length+'</b></div>'+
        (arr.length? '<div class="cm-col-list">'+arr.map(function(v){return pillHTML(v,lastCompCounts[v]||0);}).join('')+'</div>'
                   : '<div class="cm-none">없음</div>')+'</div>';
    }
    cmList.innerHTML=(ko.length+en.length)
      ? col('ㄱ~ㅎ',ko)+col('A~Z',en)
      : '<div class="cm-none">일치하는 회사가 없습니다.</div>';
    cmInfo.textContent='회사 '+names.length+'개'+(fComp.size?' · '+fComp.size+'개 선택':'');
  }
  function openCompModal(){ cmQ.value=''; renderCmList(); cmEl.classList.add('show'); cmQ.focus(); }

  // ----- 필터/정렬 -----
  var q='', sortKey='name', sortDir=1;      // dir 1=오름차순, -1=내림차순
  var groupMode='acc';                       // table | chips | acc | flat
  var expanded=new Set();                    // 펼친 그룹 키

  items.forEach(function(x){itemByKey[x._key]=x;});
  var grid=document.getElementById('grid'), empty=document.getElementById('empty'),
      resultCount=document.getElementById('resultCount'),
      loadmore=document.getElementById('loadmore'),
      listHead=document.getElementById('listHead');
  var filtered=[], display=[], shown=0;

  function mainPrice(x){
    if(x.priceMember!=null && x.priceMember>0) return x.priceMember;
    if(x.priceReal!=null && x.priceReal>0) return x.priceReal;
    if(x.priceList!=null && x.priceList>0) return x.priceList;
    return null;
  }
  function priceKey(x){var p=mainPrice(x);return p==null?Infinity:p;}

  // 그룹 최저가 (그룹 연속 정렬용 대표값)
  var gmin={};
  items.forEach(function(x){var p=priceKey(x);
    if(!(x._gk in gmin)||p<gmin[x._gk]) gmin[x._gk]=p;});
  function specCmp(a,b){return (a.spec||'').localeCompare(b.spec||'','ko',{numeric:true});}
  function gkCmp(a,b){return a._gk<b._gk?-1:(a._gk>b._gk?1:0);}
  function gminCmp(a,b){var x=gmin[a._gk],y=gmin[b._gk];return x===y?0:(x<y?-1:1);}

  // 검색어/즐겨찾기만 적용한 1차 후보 (패싯 카운트 계산용)
  function baseMatch(x,tokens){
    if(favOnly && !favs.has(x._key)) return false;
    for(var i=0;i<tokens.length;i++){
      var tk=tokens[i];
      if(x._sn.indexOf(tk)===-1 && x._sc.indexOf(tk)===-1) return false;
    }
    return true;
  }
  function txtKey(v){return (v==null?'':String(v));}
  function cmpBy(key,a,b){
    if(key==='price'){var x=priceKey(a),y=priceKey(b);return x===y?0:(x<y?-1:1);}
    if(key==='cat')  return txtKey(a.cat1).localeCompare(txtKey(b.cat1),'ko');
    if(key==='comp') return txtKey(a.company).localeCompare(txtKey(b.company),'ko');
    if(key==='spec') return txtKey(a.spec).localeCompare(txtKey(b.spec),'ko',{numeric:true});
    if(key==='pkg')  return txtKey(a.pkg).localeCompare(txtKey(b.pkg),'ko',{numeric:true});
    return txtKey(a.name).localeCompare(txtKey(b.name),'ko');
  }
  // 그룹 대표값(그룹 연속 유지용): 가격은 그룹 최저가, 그 외는 그룹 첫 항목 기준
  var grep={};
  function groupRep(x){return grep[x._gk]||x;}

  function compute(){
    var tokens=q.trim().split(/\s+/).map(norm).filter(Boolean);
    curTokens=tokens;
    var base=items.filter(function(x){return baseMatch(x,tokens);});
    updateFacets(base);
    filtered=base.filter(function(x){
      if(!fShop.has(x.shop)) return false;
      if(!fCat.has(x.cat1||'기타')) return false;
      if(fComp.size && !fComp.has(x.company||'')) return false;
      return true;
    });
    // 그룹 대표 재계산 (현재 결과 기준)
    grep={};
    filtered.forEach(function(x){
      var r=grep[x._gk];
      if(!r) { grep[x._gk]=x; return; }
      if(priceKey(x)<priceKey(r)) grep[x._gk]=x;
    });
    // 동일 그룹은 항상 연속 배치: (그룹대표 정렬키 → 그룹 → 규격)
    filtered.sort(function(a,b){
      var d=cmpBy(sortKey,groupRep(a),groupRep(b))*sortDir; if(d) return d;
      var g=gkCmp(a,b); if(g) return g;
      return specCmp(a,b);
    });
    resultCount.textContent=filtered.length;
    buildDisplay();
  }

  // 연속된 같은 그룹을 묶음 단위로 구성
  function buildDisplay(){
    display=[];
    var i=0;
    while(i<filtered.length){
      var gk=filtered[i]._gk, j=i;
      while(j<filtered.length && filtered[j]._gk===gk) j++;
      var members=filtered.slice(i,j);
      if(groupMode==='flat'){
        members.forEach(function(m){display.push({gk:m._key,ms:[m]});});
      } else {
        display.push({gk:gk,ms:members});
      }
      i=j;
    }
  }

  //    펼친 규격 행은 대표행과 동일한 열 위치(규격·포장·가격)를 그대로 사용.

    // 펼치면 대표 규격을 포함한 전 규격을 목록으로 보여준다

        '<div class="c-img">'+thumbHTML(m)+'</div>'+
        '<div class="c-comp"></div>'+
        '<div class="c-main"><div class="nm">.</div></div>'+
        '<div class="c-spec"><div class="spec-txt">'+(m.spec?hl(m.spec):'기본')+'</div></div>'+
        '<div class="c-pkg"><div class="pkg-txt">'+esc(m.pkg||'-')+'</div></div>'+
        '<div class="c-price">'+priceHTML(m)+'</div>'+
        '<div class="c-act">'+actHTML(m)+favBtnHTML(m)+'</div></div>';
    }).join('');
    return '<div class="grp'+(open?' open':'')+'" data-gk="'+esc(g.gk)+'">'+
      head+'<div class="kids'+(n>6?' scroll':'')+'">'+kids+'</div></div>';
  }
  function groupHTML(g){
    if(viewMode!=='list') return g.ms.map(cardHTML).join('');
    if(groupMode==='table') return grpTableHTML(g);
    if(groupMode==='chips') return grpChipsHTML(g);
    if(groupMode==='acc')   return grpAccHTML(g);
    return g.ms.map(function(m){return rowHTML(m);}).join('');
  }
  function renderMore(){
    var step=(groupMode==='flat')?PAGE:40;
    var next=display.slice(shown, shown+step);
    grid.insertAdjacentHTML('beforeend', next.map(groupHTML).join(''));
    shown+=next.length;
    loadmore.style.display=(shown<display.length)?'block':'none';
  }
  function apply(){
    compute();
    updateCatSel();
    grid.innerHTML=''; shown=0;
    empty.style.display=filtered.length?'none':'block';
    renderMore();
    saveState();
  }

  // ----- 이미지 확대 모달 -----
  var imgModal=document.getElementById('imgModal'), imgModalPic=document.getElementById('imgModalPic');
  imgModal.addEventListener('click',function(){imgModal.classList.remove('show');imgModalPic.src='';});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')imgModal.classList.remove('show');});

  // ----- 클릭 위임 (사진확대/코드복사/공유/하트 → 그 외는 상세페이지 새탭) -----
  document.addEventListener('click',function(e){
    // 규격칩(B): 선택한 규격으로 가격/포장/링크 전환
    var chip=e.target.closest('.specchip');
    if(chip){
      var row=chip.closest('.card'), m=itemByKey[chip.dataset.k];
      if(row&&m){
        Array.prototype.forEach.call(row.querySelectorAll('.specchip'),function(c){c.classList.remove('on');});
        chip.classList.add('on');
        row.dataset.url=m.url;
        row.querySelector('.c-price').innerHTML=priceHTML(m);
        row.querySelector('.c-pkg .pkg-txt').textContent=m.pkg||'-';
        row.querySelector('.c-act').innerHTML=actHTML(m)+favBtnHTML(m);
      }
      return;
    }
    var smore=e.target.closest('.specmore');
    if(smore){
      var cell=smore.closest('.c-spec');
      Array.prototype.forEach.call(cell.querySelectorAll('.specchip.hid'),function(c){c.style.display='';});
      smore.remove(); return;
    }
    // 그룹 펼침/접기 (A·C)
    var tg=e.target.closest('[data-toggle]');
    if(tg && !e.target.closest('.act-img') && !e.target.closest('.iconbtn')){
      var grp=tg.closest('.grp');
      if(grp){
        grp.classList.toggle('open');
        var isOpen=grp.classList.contains('open');
        if(isOpen) expanded.add(grp.dataset.gk); else expanded.delete(grp.dataset.gk);
        var btn=grp.querySelector('.spec-btn');
        if(btn) btn.textContent=expHTML(parseInt(btn.dataset.n||'0',10),isOpen);
        saveState();
      }
      return;
    }
    var imgEl=e.target.closest('.act-img');
    if(imgEl){
      imgModalPic.onerror=function(){ this.onerror=null; this.src=imgEl.dataset.fallback; };
      imgModalPic.src=imgEl.dataset.big;
      imgModal.classList.add('show');
      return;
    }
    var codeEl=e.target.closest('.act-code');
    if(codeEl){ copyText(codeEl.dataset.code,'상품코드 복사됨: '+codeEl.dataset.code); return; }
    var shareEl=e.target.closest('.act-share');
    if(shareEl){ copyText(shareEl.dataset.url,'상품 링크가 복사되었습니다'); return; }
    var favEl=e.target.closest('[data-fav]');
    if(favEl){
      var id=String(favEl.dataset.fav);
      if(favs.has(id)){favs.delete(id);favEl.classList.remove('on');}
      else{favs.add(id);favEl.classList.add('on');}
      saveFavs(); updateFavCount();
      if(favOnly) apply();
      return;
    }
    // 나머지 행 영역 클릭 → 이덴트 상세페이지 새탭
    var card=e.target.closest('.card');
    if(card && card.dataset.url){ window.open(card.dataset.url,'_blank','noopener'); }
  });

  // ----- 무한 스크롤 -----
  var io=new IntersectionObserver(function(es){
    if(es[0].isIntersecting && shown<filtered.length) renderMore();
  },{rootMargin:'600px'});
  io.observe(document.getElementById('sentinel'));
  document.getElementById('loadmoreBtn').addEventListener('click',renderMore);

  // ----- 검색/정렬 -----
  // ----- 새로고침해도 화면 상태 유지 (검색어·필터·정렬·펼침 등) -----
  var ST_KEY='edent_state';
  var stTimer=null;
  function saveState(){
    if(stTimer) clearTimeout(stTimer);
    stTimer=setTimeout(function(){
      try{
        sessionStorage.setItem(ST_KEY, JSON.stringify({
          q:q, sortKey:sortKey, sortDir:sortDir, groupMode:groupMode, viewMode:viewMode,
          favOnly:favOnly, shop:Array.from(fShop), cat:Array.from(fCat), comp:Array.from(fComp),
          compQ:(document.getElementById('compQ')||{}).value||'',
          exp:Array.from(expanded), shown:shown, scroll:window.scrollY
        }));
      }catch(e){}
    },150);
  }
  function loadState(){
    try{ return JSON.parse(sessionStorage.getItem(ST_KEY)||'null'); }catch(e){ return null; }
  }
  window.addEventListener('scroll',saveState,{passive:true});

  var qEl=document.getElementById('q'), t=null;
  qEl.addEventListener('input',function(){q=qEl.value;if(t)clearTimeout(t);t=setTimeout(apply,160);});
  // 화면 폭이 바뀌면 회사 칩 노출 개수 재계산
  (function(){var rt=null;window.addEventListener('resize',function(){
    if(rt)clearTimeout(rt);rt=setTimeout(function(){renderCompBar(lastCompCounts);},200);});})();
  // 그룹 표시 방식
  function setGroupMode(v){
    groupMode=v;
    grid.classList.remove('m-table','m-chips','m-acc');
    if(v==='table') grid.classList.add('m-table');
    else if(v==='chips') grid.classList.add('m-chips');
    else if(v==='acc') grid.classList.add('m-acc');
  }
  document.getElementById('groupMode').addEventListener('change',function(e){
    setGroupMode(e.target.value); expanded.clear();
    try{localStorage.setItem('edent_gmode',groupMode);}catch(err){}
    apply();
  });

  // 머릿행 클릭 정렬 (같은 열 재클릭 → 오름/내림 전환)
  function markSort(){
    Array.prototype.forEach.call(listHead.querySelectorAll('.sortable'),function(th){
      var on=(th.dataset.sort===sortKey);
      th.classList.toggle('on',on);
      th.querySelector('i').textContent=on?(sortDir===1?'▲':'▼'):'↕';
    });
  }
  Array.prototype.forEach.call(listHead.querySelectorAll('.sortable'),function(th){
    th.addEventListener('click',function(){
      var k=th.dataset.sort;
      if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=1; }
      markSort(); apply();
    });
  });
  markSort();

  // ----- 뷰 모드 (목록형 기본) -----
  var VIEW_KEY='edent_view';
  var listBtn=document.getElementById('viewListBtn'), gridBtn=document.getElementById('viewGridBtn');
  function setView(mode){
    viewMode=(mode==='grid')?'grid':'list';
    var isList=(viewMode==='list');
    grid.classList.toggle('viewlist',isList);
    grid.classList.toggle('viewgrid',!isList);
    listHead.style.display=isList?'flex':'none';
    listBtn.classList.toggle('on',isList);
    gridBtn.classList.toggle('on',!isList);
    try{localStorage.setItem(VIEW_KEY,viewMode);}catch(e){}
    apply();
  }
  listBtn.addEventListener('click',function(){setView('list');});
  gridBtn.addEventListener('click',function(){setView('grid');});

  // ----- 초기화: 이전 화면 상태가 있으면 그대로 복원 -----
  (function(){
    var st=loadState();
    var gm='acc';
    try{ gm=localStorage.getItem('edent_gmode')||'acc'; }catch(e){}
    if(st&&st.groupMode) gm=st.groupMode;
    if(['table','chips','acc','flat'].indexOf(gm)===-1) gm='acc';
    document.getElementById('groupMode').value=gm;
    setGroupMode(gm);

    var vw='list';
    try{ vw=localStorage.getItem(VIEW_KEY)||'list'; }catch(e){}
    if(st&&st.viewMode) vw=st.viewMode;

    if(st){
      q=st.q||''; qEl.value=q;
      if(st.sortKey) sortKey=st.sortKey;
      if(st.sortDir) sortDir=st.sortDir;
      favOnly=!!st.favOnly; favFilterBtn.classList.toggle('on',favOnly);
      if(st.shop&&st.shop.length){ fShop=new Set(st.shop); }
      if(st.cat &&st.cat.length){  fCat =new Set(st.cat);  }
      if(st.comp){ fComp=new Set(st.comp); }
      if(st.compQ) document.getElementById('compQ').value=st.compQ;
      if(st.exp) expanded=new Set(st.exp);
      markSort();
    }
    setView(vw);                                  // 내부에서 apply() 호출

    if(st){
      // 스크롤 위치까지 복원 (그 지점까지 목록을 미리 그려둠)
      var need=st.shown||0;
      var guard=0;
      while(shown<need && shown<display.length && guard++<200) renderMore();
      if(st.scroll) setTimeout(function(){ window.scrollTo(0,st.scroll); },60);
    }
  })();
})();
</script>
</body>
</html>
