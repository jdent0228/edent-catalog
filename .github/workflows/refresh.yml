name: 카탈로그 갱신

on:
  schedule:
    - cron: '0 20 * * *'      # 매일 20:00 UTC = 05:00 KST (1일 주기)
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: edent-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 접근 진단 (클라우드에서 쇼핑몰 응답 확인)
        shell: pwsh
        run: |
          foreach ($u in @(
            'https://www.edent.co.kr/program/show_cate_all_make.php',
            'https://www.edent.co.kr/shop/shop_list.php?cate1=2',
            'https://www.seilglobal.co.kr/shop/shopbrand.html?xcode=002'
          )) {
            try {
              $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 30 `
                    -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
              $n = ([regex]::Matches($r.Content, 'pd_idx=|branduid=')).Count
              Write-Host "OK  $u → HTTP $($r.StatusCode), $($r.RawContentLength) bytes, 상품링크 $n개"
            } catch {
              Write-Host "FAIL $u → $($_.Exception.Message)"
            }
          }

      - name: 이덴트 크롤 (회원가 + 규격그룹 + 제조국)
        shell: pwsh
        env:
          EDENT_ID: ${{ secrets.EDENT_ID }}
          EDENT_PW: ${{ secrets.EDENT_PW }}
        run: ./crawl.ps1 -Details

      - name: 세일글로벌 크롤 (비로그인)
        shell: pwsh
        run: ./crawl-seil.ps1

      - name: 통합 빌드
        shell: pwsh
        run: ./build.ps1

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js data-edent.json data-seil.json company-map.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 상품 카탈로그 자동 갱신"
            git push
          fi
