name: 이덴트 카탈로그 갱신

on:
  schedule:
    - cron: '0 20 * * *'      # 매일 20:00 UTC = 05:00 KST (1일 주기)
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: edent-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 전체 크롤 (회원가 + 규격그룹 포함)
        shell: pwsh
        env:
          EDENT_ID: ${{ secrets.EDENT_ID }}
          EDENT_PW: ${{ secrets.EDENT_PW }}
        run: ./crawl.ps1 -Details

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 상품 카탈로그 자동 갱신"
            git push
          fi
